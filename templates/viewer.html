<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download {{ file_info.filename }} - AHB File Hub</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #131b2e; border: 1px solid #1e293b; padding: 30px; border-radius: 16px; width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; font-size: 18px; margin-bottom: 10px; word-break: break-all; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .banner { margin-bottom: 15px; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 35px; margin-bottom: 10px;">📦</div>
        <h2>{{ file_info.filename }}</h2>
        <p>Your requested file is ready for secure download.</p>
        
        <div class="banner">
            <img src="https://via.placeholder.com/350x60/1e293b/10b981?text=SPONSORED+BANNER+AD" alt="Ad" style="width:100%; border-radius:6px;">
        </div>

        <a href="/download-ad/{{ file_id }}" class="btn">Download File 🚀</a>
    </div>
</body>
</html>
