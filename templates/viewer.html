<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View & Download - {{ filename }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #08080e; color: #f0f4ff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 800px; background: rgba(16, 20, 36, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 26px; box-shadow: 0 20px 48px rgba(0,0,0,0.8); }
    h2 { color: #a0e9ff; margin-bottom: 14px; font-size: 1.2rem; }
    pre { background: #000; padding: 16px; border-radius: 12px; color: #7af3ff; overflow-x: auto; font-family: monospace; font-size: 0.85rem; max-height: 250px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    
    .ad-container { display: flex; justify-content: center; margin: 15px 0; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); }

    .btn-download {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: 0.2s;
    }
    .btn-download:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📄 Isolated File: {{ filename }}</h2>
    <pre><code>{{ content }}</code></pre>

    <!-- Secure Banner Ad 2 (300x250) Sandboxed -->
    <div class="ad-container">
      <iframe sandbox="allow-scripts allow-same-origin" style="border:none; width:300px; height:250px; overflow:hidden;" srcdoc='
        <script>
          atOptions = {
            "key" : "66b634384630a2b082173552730d81a0",
            "format" : "iframe",
            "height" : 250,
            "width" : 300,
            "params" : {}
          };
        </script>
        <script src="https://www.highperformanceformat.com/66b634384630a2b082173552730d81a0/invoke.js"></script>
      '></iframe>
    </div>

    <!-- Smart Link Button with Double-Click Ad Trigger -->
    <button class="btn-download" id="downloadBtn" onclick="handleSmartDownload()">
      <i class="fas fa-download"></i> View / Download XML File
    </button>
  </div>

  <script>
    let clickCount = 0;
    // Aapka Smart Link integration
    const smartLinkUrl = "https://www.effectivecpmnetwork.com/xxzz1j2s?key=18168874abae8f6e106244faf40552cd"; 
    const fileName = "{{ filename }}";
    const fileContent = `{{ content | safe }}`;

    function handleSmartDownload() {
      clickCount++;

      if (clickCount === 1) {
        // Pehla click: Smart link / Ad open karega new tab mein
        window.open(smartLinkUrl, '_blank');
        
        // Button update for second click action
        document.getElementById('downloadBtn').innerHTML = '<i class="fas fa-exclamation-circle"></i> Click Again to Download File';
        
      } else if (clickCount === 2) {
        // Doosra click: Actual XML file download start kar dega
        const blob = new Blob([fileContent], { type: 'text/xml' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        document.getElementById('downloadBtn').innerHTML = '<i class="fas fa-check-circle"></i> Download Started Successfully!';
        document.getElementById('downloadBtn').style.background = '#10b981';
      }
    }
  </script>
</body>
</html>
