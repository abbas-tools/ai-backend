<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>AHB Files Hub - Premium Downloads</title>
    
    <!-- ===== ADSTERRA SOCIAL BAR SCRIPT ===== -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at 10% 20%, #0f172a 0%, #020617 100%);
            color: #f1f5f9;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(56,189,248,0.05) 0%, transparent 60%);
            pointer-events: none;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            pointer-events: none;
        }
        .glow-orb.orb1 { width: 300px; height: 300px; background: #0ea5e9; top: -120px; right: -100px; }
        .glow-orb.orb2 { width: 250px; height: 250px; background: #818cf8; bottom: -100px; left: -80px; }
        .logo-icon { font-size: 60px; display: block; margin-bottom: 10px; }
        .logo-text {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-sub {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.5;
            margin-top: 4px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            max-width: 320px;
            margin: 20px auto 28px;
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            color: white;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-keyframes(0.175, 0.885, 0.32, 1.275);
        }
        .btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: #38bdf8;
            color: #f1f5f9;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(56,189,248,0.1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-card { animation: fadeInUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="glow-orb orb1"></div>
        <div class="glow-orb orb2"></div>
        <span class="logo-icon">⚡</span>
        <div class="logo-text">AHB FILES HUB</div>
        <div class="logo-sub">Premium File Sharing Platform</div>
        <p>Welcome! Please use the official link provided in the video description or social media bio to access your specific download file.</p>
        <a href="/admin-login" class="btn">🔒 Admin Panel Login</a>
    </div>
</body>
</html>
