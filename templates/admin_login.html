<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Login - AHB File Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at 10% 20%, #0f172a 0%, #020617 100%);
            color: #f1f5f9;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(56,189,248,0.05) 0%, transparent 60%);
            pointer-events: none;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            pointer-events: none;
        }
        .glow-orb.orb1 { width: 300px; height: 300px; background: #0ea5e9; top: -120px; right: -100px; }
        .glow-orb.orb2 { width: 250px; height: 250px; background: #818cf8; bottom: -100px; left: -80px; }
        .icon { font-size: 36px; display: block; margin-bottom: 6px; }
        h2 { font-size: 20px; color: #38bdf8; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .error-box {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.15);
            padding: 10px 16px;
            border-radius: 12px;
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .input-group { margin-bottom: 16px; }
        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.25);
            color: #f1f5f9;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
            background: rgba(0,0,0,0.35);
        }
        input::placeholder { color: #94a3b8; opacity: 0.6; }
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px rgba(0,0,0,0.25) inset !important;
            -webkit-text-fill-color: #f1f5f9 !important;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #818cf8);
            box-shadow: 0 8px 24px rgba(56,189,248,0.15);
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:hover::after { opacity: 1; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(56,189,248,0.25); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .back-link {
            display: block;
            margin-top: 18px;
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            opacity: 0.6;
            transition: all 0.3s ease;
            text-align: center;
        }
        .back-link:hover { opacity: 1; color: #38bdf8; }
        .footer-text {
            margin-top: 20px;
            font-size: 11px;
            color: #475569;
            text-align: center;
            opacity: 0.4;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-card { animation: fadeInUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        @media (max-width: 480px) {
            .glass-card { padding: 24px 16px; border-radius: 20px; }
        }
        /* Password show/hide toggle */
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }
        .password-toggle:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="glow-orb orb1"></div>
        <div class="glow-orb orb2"></div>
        <span class="icon">🔐</span>
        <h2>Admin Access</h2>
        <p class="subtitle">Enter credentials to manage files</p>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST" id="loginForm">
            <div class="input-group">
                <input type="text" name="username" id="username" placeholder="Username (admin)" required autofocus>
            </div>
            <div class="input-group password-wrapper">
                <input type="password" name="password" id="password" placeholder="Password (KING56)" required>
                <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
            </div>
            <button type="submit" class="btn" id="loginBtn">Login →</button>
        </form>
        <a href="/" class="back-link">← Back to Home</a>
        <div class="footer-text">AHB File Hub v2.0</div>
    </div>

    <script>
        // Password show/hide toggle
        function togglePassword() {
            const password = document.getElementById('password');
            const toggle = document.querySelector('.password-toggle');
            if (password.type === 'password') {
                password.type = 'text';
                toggle.textContent = '🙈';
            } else {
                password.type = 'password';
                toggle.textContent = '👁️';
            }
        }

        // Prevent multiple submissions
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Logging in...';
        });

        // Enter key support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').submit();
            }
        });
    </script>
</body>
</html>
