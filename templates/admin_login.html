<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - KING5656</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #08080e; color: #f0f4ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { width: 100%; max-width: 400px; background: rgba(16, 20, 36, 0.9); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 32px; box-shadow: 0 20px 48px rgba(0,0,0,0.8); text-align: center; }
    h2 { color: #a0e9ff; margin-bottom: 20px; font-size: 1.5rem; }
    input { width: 100%; padding: 14px; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; margin-bottom: 16px; font-size: 1rem; text-align: center; }
    button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; font-weight: 600; cursor: pointer; font-size: 1rem; }
    .error { color: #ff6b6b; font-size: 0.85rem; margin-bottom: 12px; }
    .back { display: block; margin-top: 15px; color: #6b8cff; font-size: 0.85rem; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2><i class="fas fa-shield-alt"></i> Admin Panel</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Enter Admin Password" required autofocus>
      <button type="submit">Login</button>
    </form>
    <a href="/" class="back"><i class="fas fa-arrow-left"></i> Back to Home</a>
  </div>
</body>
</html>
