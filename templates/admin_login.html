<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Login - AHB File Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at 10% 20%, #0f172a 0%, #020617 100%);
            color: #f1f5f9;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(56,189,248,0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }
        .glow-orb.orb1 { width: 300px; height: 300px; background: #0ea5e9; top: -120px; right: -100px; }
        .glow-orb.orb2 { width: 250px; height: 250px; background: #818cf8; bottom: -100px; left: -80px; }
        .icon { font-size: 36px; display: block; margin-bottom: 6px; position: relative; z-index: 1; }
        h2 { font-size: 20px; color: #38bdf8; margin-bottom: 6px; position: relative; z-index: 1; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; position: relative; z-index: 1; }
        .error-box {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.15);
            padding: 10px 16px;
            border-radius: 12px;
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .input-group { margin-bottom: 16px; position: relative; z-index: 1; }
        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.25);
            color: #f1f5f9;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
            background: rgba(0,0,0,0.35);
        }
        input::placeholder { color: #94a3b8; opacity: 0.6; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #818cf8);
            box-shadow: 0 8px 24px rgba(56,189,248,0.15);
            position: relative;
            z-index: 1;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(56,189,248,0.25); }
        .btn:active { transform: scale(0.97); }
        .back-link {
            display: block;
            margin-top: 18px;
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            opacity: 0.6;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .back-link:hover { opacity: 1; color: #38bdf8; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-card { animation: fadeInUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="glow-orb orb1"></div>
        <div class="glow-orb orb2"></div>
        <span class="icon">🔐</span>
        <h2>Admin Access</h2>
        <p class="subtitle">Enter credentials to manage files</p>
        
        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username (admin)" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password (KING56)" required>
            </div>
            <button type="submit" class="btn">Login →</button>
        </form>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
