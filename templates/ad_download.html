<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparing Download - AHB File Hub</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #131b2e; border: 1px solid #1e293b; padding: 30px; border-radius: 16px; width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #f59e0b; font-size: 20px; margin-bottom: 10px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .ad-container { background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: not-allowed; text-decoration: none; display: inline-block; opacity: 0.6; box-sizing: border-box; }
        .btn.active { background: linear-gradient(135deg, #10b981, #059669); cursor: pointer; opacity: 1; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📢 Ad Verification</h2>
        <p>Please view the advertisement below to support us while your link initializes.</p>
        
        <div class="ad-container">
            <img src="https://via.placeholder.com/320x90/1e293b/f59e0b?text=YOUR+MONETIZATION+AD" alt="Ad" style="width:100%; border-radius:6px; margin-bottom:10px;">
            <span style="font-size: 11px; color: #64748b;">Advertisement Space</span>
        </div>

        <p id="timer-text">Please wait <span id="countdown" style="color: #38bdf8; font-weight: bold;">5</span> seconds...</p>
        
        <a href="/download/{{ file_id }}" id="download-btn" class="btn">Download File Now</a>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        const downloadBtn = document.getElementById('download-btn');
        const timerText = document.getElementById('timer-text');

        let timer = setInterval(() => {
            timeLeft--;
            countdownEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerText.innerText = "Ready to download!";
                downloadBtn.classList.add('active');
            }
        }, 1000);
    </script>
</body>
</html>
