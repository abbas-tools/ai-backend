<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ad Verification - AHB File Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at 10% 20%, #0f172a 0%, #020617 100%);
            color: #f1f5f9;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 30px 28px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .glass-card>* { position: relative; z-index: 1; }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .glow-orb.orb1 { width: 300px; height: 300px; background: #0ea5e9; top: -120px; right: -100px; }
        .glow-orb.orb2 { width: 250px; height: 250px; background: #818cf8; bottom: -100px; left: -80px; }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .icon { font-size: 36px; display: block; margin-bottom: 4px; }
        h2 { font-size: 20px; color: #f59e0b; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }

        /* AD BOX - Real Ads in Sandbox iframe */
        .ad-box {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 12px;
            margin: 16px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .ad-box iframe {
            width: 100%;
            max-width: 320px;
            height: 60px;
            border: none;
            border-radius: 8px;
            /* 🔒 SANDBOX ATTRIBUTE - No redirect, no popups, no top navigation */
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups-to-escape-sandbox";
            /* Security: prevent top-level navigation */
            allow="autoplay; encrypted-media";
        }
        /* Security: Prevent iframe from redirecting top window */
        .ad-box iframe[seamless] {
            display: block;
        }
        .ad-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            opacity: 0.4;
            margin-top: 6px;
            display: block;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 0 #065f46, 0 12px 30px rgba(16,185,129,0.2);
            cursor: pointer;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 0 #065f46, 0 20px 40px rgba(16,185,129,0.3); }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #065f46, 0 8px 20px rgba(16,185,129,0.15); }

        .file-name {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .file-name strong { color: #38bdf8; }

        .safe-badge {
            font-size: 11px;
            color: #10b981;
            margin-top: 12px;
            opacity: 0.6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        @media (max-width: 480px) {
            .glass-card { padding: 24px 16px; border-radius: 20px; }
            .logo-text { font-size: 20px; }
            .ad-box iframe { height: 50px; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-card { animation: fadeInUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="glow-orb orb1"></div>
        <div class="glow-orb orb2"></div>

        <span class="icon">📢</span>
        <h2>Ad Verification</h2>
        <p class="subtitle">Please view the advertisement below to support us</p>

        <div class="file-name">📄 File: <strong>{{ file_info.filename }}</strong></div>

        <!-- ===== REAL ADS IN SANDBOX IFRAME ===== -->
        <div class="ad-box">
            <!-- 🔒 SANDBOX IFRAME - Real ads show honge, redirect nahi honge -->
            <iframe 
                srcdoc="
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <script>
                            atOptions = {
                                'key' : '03b4a64917d99a52eb71ea7bea6414d6',
                                'format' : 'iframe',
                                'height' : 50,
                                'width' : 320,
                                'params' : {}
                            };
                        <\/script>
                        <script src='https://www.highperformanceformat.com/03b4a64917d99a52eb71ea7bea6414d6/invoke.js'><\/script>
                    </head>
                    <body style='margin:0;padding:0;background:transparent;'>
                    </body>
                    </html>
                "
                sandbox="allow-scripts allow-same-origin allow-forms"
                loading="lazy"
                style="width:100%; max-width:320px; height:60px; border:none; border-radius:8px; background:transparent;">
            </iframe>
            <span class="ad-label">📢 Advertisement</span>
        </div>

        <p style="color: #10b981; font-weight: 600; margin: 10px 0;">✅ Ready to download!</p>

        <a href="{{ url_for('download_file', file_id=file_id) }}" class="btn">
            ⬇ Download Now
        </a>

        <div class="safe-badge">
            🔒 Safe & Secure — No Auto Redirect
        </div>
    </div>

    <!-- 🔒 Extra Protection: Prevent iframe redirects -->
    <script>
        // Block any attempts to redirect the parent window from iframe
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'redirect') {
                e.preventDefault();
                return false;
            }
        });

        // Prevent iframe from navigating top
        document.querySelectorAll('iframe').forEach(function(iframe) {
            iframe.addEventListener('load', function() {
                try {
                    // If iframe tries to redirect, block it
                    if (iframe.contentWindow && iframe.contentWindow.location) {
                        // Allow only iframe internal navigation
                    }
                } catch(e) {
                    // Cross-origin - safe
                }
            });
        });
    </script>
</body>
</html>
