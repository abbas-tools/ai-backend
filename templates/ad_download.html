<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ad Verification - AHB File Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at 10% 20%, #0f172a 0%, #020617 100%);
            color: #f1f5f9;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 30px 28px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(56,189,248,0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .glass-card>* { position: relative; z-index: 1; }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .glow-orb.orb1 { width: 300px; height: 300px; background: #0ea5e9; top: -120px; right: -100px; }
        .glow-orb.orb2 { width: 250px; height: 250px; background: #818cf8; bottom: -100px; left: -80px; }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .icon { font-size: 36px; display: block; margin-bottom: 4px; }
        h2 { font-size: 20px; color: #f59e0b; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }

        .ad-box {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 12px;
            margin: 16px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .ad-box iframe {
            width: 100%;
            max-width: 320px;
            height: 60px;
            border: none;
            border-radius: 8px;
        }
        .ad-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            opacity: 0.4;
            margin-top: 6px;
            display: block;
        }

        .countdown-text {
            font-size: 14px;
            margin: 16px 0;
        }
        .countdown-number {
            color: #38bdf8;
            font-weight: 700;
            font-size: 28px;
            display: inline-block;
            min-width: 40px;
            text-shadow: 0 0 20px rgba(56,189,248,0.2);
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: not-allowed;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            width: 100%;
            background: linear-gradient(135deg, #475569, #334155);
            box-shadow: 0 8px 0 #1e293b, 0 12px 30px rgba(0,0,0,0.2);
            opacity: 0.6;
            pointer-events: none;
            position: relative;
        }
        .btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 0 #065f46, 0 12px 30px rgba(16,185,129,0.2);
            opacity: 1;
            cursor: pointer;
            pointer-events: auto;
        }
        .btn.active:hover { transform: translateY(-3px); box-shadow: 0 12px 0 #065f46, 0 20px 40px rgba(16,185,129,0.3); }
        .btn.active:active { transform: translateY(4px); box-shadow: 0 4px 0 #065f46, 0 8px 20px rgba(16,185,129,0.15); }

        .file-name {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .file-name strong { color: #38bdf8; }

        /* Lock overlay - Ad ko lock karta hai */
        .ad-lock {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            z-index: 10;
            cursor: default;
            transition: all 0.5s ease;
        }
        .ad-lock.unlocked {
            opacity: 0;
            pointer-events: none;
        }
        .ad-lock .lock-icon {
            font-size: 28px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .ad-lock .lock-icon span {
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .glass-card { padding: 24px 16px; border-radius: 20px; }
            .countdown-number { font-size: 24px; }
            .logo-text { font-size: 20px; }
            .ad-box iframe { height: 50px; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-card { animation: fadeInUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="glow-orb orb1"></div>
        <div class="glow-orb orb2"></div>

        <span class="icon">📢</span>
        <h2>Ad Verification</h2>
        <p class="subtitle">Please view the advertisement below to support us</p>

        <div class="file-name">📄 File: <strong>{{ file_info.filename }}</strong></div>

        <!-- ===== AD WITH LOCK ===== -->
        <div class="ad-box" id="adContainer">
            <!-- Lock Overlay - Countdown ke baad unlock hoga -->
            <div class="ad-lock" id="adLock">
                <div class="lock-icon">
                    🔒 <span id="lockText">Wait {{ countdown if countdown else 10 }}s</span>
                </div>
            </div>
            
            <!-- Safe Ad Display - No Auto Redirect -->
            <div style="width:100%; display:flex; justify-content:center;">
                <a href="https://www.effectivecpmnetwork.com/xxzz1j2s?key=18168874abae8f6e106244faf40552cd" 
                   target="_blank" 
                   style="display:block; text-decoration:none; width:100%; max-width:320px;"
                   id="adLink">
                    <img src="https://via.placeholder.com/320x50/0ea5e9/ffffff?text=Support+Us+-+Click+Here" 
                         alt="Advertisement" 
                         style="width:100%; border-radius:8px;">
                </a>
            </div>
            <span class="ad-label">📢 Advertisement</span>
        </div>

        <p class="countdown-text">
            Please wait <span class="countdown-number" id="countdown">10</span> seconds...
        </p>

        <a href="{{ url_for('download_file', file_id=file_id) }}" id="download-btn" class="btn">
            ⏳ Wait for download
        </a>
    </div>

    <script>
        (function() {
            let timeLeft = 10;
            const countdownEl = document.getElementById('countdown');
            const downloadBtn = document.getElementById('download-btn');
            const adLock = document.getElementById('adLock');
            const lockText = document.getElementById('lockText');
            const adContainer = document.getElementById('adContainer');

            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;
                
                // Update lock text
                if (lockText) {
                    lockText.textContent = 'Wait ' + timeLeft + 's';
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownEl.innerText = '✓';
                    const parent = countdownEl.parentElement;
                    if (parent) parent.innerText = '✅ Ready to download!';
                    
                    // Unlock ad
                    if (adLock) {
                        adLock.classList.add('unlocked');
                    }
                    
                    // Activate download button
                    downloadBtn.classList.add('active');
                    downloadBtn.innerHTML = '⬇ Download Now';
                    downloadBtn.href = "{{ url_for('download_file', file_id=file_id) }}";
                }
            }, 1000);

            // Safe ad click - user intentionally clicks
            document.getElementById('adLink').addEventListener('click', function(e) {
                // Ad already unlocked, user clicked intentionally
                console.log('Ad clicked by user');
            });

        })();
    </script>
</body>
</html>
